[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrt-framework"
version = "0.0.1"
description = "Provider-neutral contracts and research foundations for Content Tone & Revenue Transparency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrt = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ctrt"]

[[tool.mypy.overrides]]
module = "ctrt.reviewer_credential_attestation"
allow_redefinition = true

[[tool.mypy.overrides]]
module = "ctrt.adjudicator_credential_attestation"
allow_redefinition = true

[[tool.mypy.overrides]]
module = "ctrt.adjudicator_checkpoint_conflict_credential_attestation"
allow_redefinition = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_reviewer_credential_attestation.py" = ["I001"]
"tests/test_checkpoint_witness_attestation.py" = ["I001", "F401", "UP035"]
"tests/test_witness_conflict_adjudication.py" = ["I001", "F401", "UP035"]
"tests/test_adjudicator_credential_attestation.py" = ["I001", "F401", "UP035"]
