name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Remove unused adjudication imports
        if: ${{ github.head_ref == 'phase1/adjudicator-checkpoint-witness-conflict-adjudication' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/ctrt/adjudicator_checkpoint_witness_conflict_adjudication.py'): (
                  '    WitnessConflictAdjudicationError,\n',
                  '',
              ),
              Path('src/ctrt/adjudicated_adjudicator_checkpoint_witness_runner.py'): (
                  '    AdjudicatorCheckpointWitnessDecisionReport,\n',
                  '',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ctrt/adjudicator_checkpoint_witness_conflict_adjudication.py \
              src/ctrt/adjudicated_adjudicator_checkpoint_witness_runner.py
            git commit -m "Remove unused adjudication imports"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q
