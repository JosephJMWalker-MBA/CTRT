name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      - name: Publish generated adjudication corpus
        if: ${{ github.head_ref == 'phase1/adjudicator-checkpoint-witness-conflict-adjudication' }}
        run: |
          target=docs/corpora/extraction/synthetic-corpus.v1.4.0.json
          if [ ! -f "$target" ]; then
            cp generated-artifacts/synthetic-corpus.v1.4.0.json "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git commit -m "Publish adjudicator checkpoint witness adjudication corpus"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
