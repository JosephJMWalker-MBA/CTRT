name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Tighten schema rejection assertion
        if: ${{ github.head_ref == 'phase1/adjudicator-checkpoint-witness-attestation' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_adjudicator_checkpoint_witness_attestation.py")
          text = path.read_text(encoding="utf-8")
          if "from jsonschema import ValidationError" not in text:
              text = text.replace(
                  "import pytest\n",
                  "import pytest\nfrom jsonschema import ValidationError\n",
              )
          text = text.replace(
              "with pytest.raises(Exception):",
              "with pytest.raises(ValidationError):",
          )
          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_adjudicator_checkpoint_witness_attestation.py
            git commit -m "Use exact schema validation exception"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q
