name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Repair adjudication references and test harness
        if: ${{ github.head_ref == 'phase1/adjudicator-checkpoint-witness-conflict-adjudication' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          test_path = Path(
              'tests/test_adjudicator_checkpoint_witness_conflict_adjudication.py'
          )
          text = test_path.read_text(encoding='utf-8')
          old = (
              '    selected = bound or corpus()\n'
              '    plan = plan_for(selected.corpus)\n'
          )
          new = (
              '    selected = bound or corpus()\n'
              '    selected_record = decision_record or conflict_adjudication()\n'
              '    if selected.adjudication_ref != selected_record.reference():\n'
              '        document = load_document(CORPUS_PATH)\n'
              '        document["corpus_id"] = (\n'
              '            "corpus.synthetic-three-items.adjudicator-checkpoint-witness-"\n'
              '            f"adjudication-bound.{selected_record.status.value}-test"\n'
              '        )\n'
              '        document["corpus_version"] = (\n'
              '            f"1.4.1-test-{selected_record.status.value}"\n'
              '        )\n'
              '        document[\n'
              '            "adjudicator_checkpoint_witness_conflict_adjudication_ref"\n'
              '        ] = stored_ref_document(selected_record.reference())\n'
              '        selected = corpus(document)\n'
              '    plan = plan_for(selected.corpus)\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              '        adjudication=decision_record or conflict_adjudication(),\n',
              '        adjudication=selected_record,\n',
              1,
          )
          test_path.write_text(text, encoding='utf-8')

          source = Path(
              'docs/corpora/extraction/synthetic-corpus.v1.3.0.json'
          )
          target = Path(
              'docs/corpora/extraction/synthetic-corpus.v1.4.0.json'
          )
          document = json.loads(source.read_text(encoding='utf-8'))
          document['corpus_id'] = (
              'corpus.synthetic-three-items.'
              'adjudicator-checkpoint-witness-adjudication-bound'
          )
          document['corpus_version'] = '1.4.0'
          document['created_at'] = '2026-08-03T16:01:00Z'
          document['adjudicator_checkpoint_witness_attestation_refs'] = [
              {
                  'artifact_id': (
                      'checkpoint-witness-attestation:'
                      'attestation.synthetic.adjudicator-alpha.v0.1.0'
                  ),
                  'artifact_hash': (
                      'sha256:5d2c87e61e76cabb114e51692bb44b3f2c9de5f14eb6a1e28c7da7c464c0a267'
                  ),
                  'canonicalization_version': 'ctrt-canonical-json@0.1.0',
                  'media_type': 'application/json',
              },
              {
                  'artifact_id': (
                      'checkpoint-witness-attestation:'
                      'attestation.synthetic.adjudicator-beta.v0.1.0'
                  ),
                  'artifact_hash': (
                      'sha256:fa2f6713be315e5b0cef2f92d66a69980eab376821d7ad9cf5020fd9283627f8'
                  ),
                  'canonicalization_version': 'ctrt-canonical-json@0.1.0',
                  'media_type': 'application/json',
              },
              {
                  'artifact_id': (
                      'checkpoint-witness-attestation:'
                      'attestation.synthetic.adjudicator-gamma.conflict.v0.1.0'
                  ),
                  'artifact_hash': (
                      'sha256:807375f416e1fbf9c4dff0799da57ccdac885ec8bf863021a74a5df8d41f51e9'
                  ),
                  'canonicalization_version': 'ctrt-canonical-json@0.1.0',
                  'media_type': 'application/json',
              },
          ]
          document[
              'adjudicator_checkpoint_witness_adjudication_predecessor_corpus_ref'
          ] = {
              'artifact_id': (
                  'corpus.synthetic-three-items.'
                  'adjudicator-checkpoint-witness-bound'
              ),
              'artifact_version': '1.3.0',
              'artifact_hash': (
                  'sha256:640fbcb6d5fac9fe5e686c5dcc625263beff1c5dd9a9ad585f6240b04f00e650'
              ),
          }
          document[
              'adjudicator_checkpoint_witness_conflict_adjudicator_registry_ref'
          ] = {
              'artifact_id': (
                  'registry.synthetic-adjudicator-checkpoint-'
                  'witness-conflict-adjudicators'
              ),
              'artifact_version': '0.1.0',
              'artifact_hash': (
                  'sha256:75d53fccaf08e780f26e18ee3be142681ea28fad9160c79ff047b7ec89a5af1c'
              ),
          }
          document[
              'adjudicator_checkpoint_witness_conflict_adjudication_policy_ref'
          ] = {
              'artifact_id': (
                  'policy.synthetic-adjudicator-checkpoint-'
                  'witness-conflict-adjudication'
              ),
              'artifact_version': '0.1.0',
              'artifact_hash': (
                  'sha256:49ec2d5e4fe656a455a08cfc89bce8be74f20a5de7261791a3321d68f1545f3c'
              ),
          }
          document[
              'adjudicator_checkpoint_witness_conflict_adjudication_ref'
          ] = {
              'artifact_id': (
                  'witness-conflict-adjudication:'
                  'adjudication.synthetic.adjudicator-checkpoint-'
                  'gamma-conflict.v0.1.0'
              ),
              'artifact_hash': (
                  'sha256:4155e103aea342e5fc9e33d8f8242a7dcb55921b0c17659d0744c60a343c98e0'
              ),
              'canonicalization_version': 'ctrt-canonical-json@0.1.0',
              'media_type': 'application/json',
          }
          target.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              tests/test_adjudicator_checkpoint_witness_conflict_adjudication.py \
              docs/corpora/extraction/synthetic-corpus.v1.4.0.json
            git commit -m "Repair adjudicator checkpoint conflict fixture graph"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q
