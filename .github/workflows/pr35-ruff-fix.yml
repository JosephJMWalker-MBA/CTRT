name: PR35 Ruff fix

on:
  push:
    branches:
      - phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.1
      - run: python -m ruff check --fix src/ctrt/witness_conflict_adjudicator_checkpoint_witness.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ctrt/witness_conflict_adjudicator_checkpoint_witness.py
          git commit -m "Format checkpoint witness adapter"
          git push
