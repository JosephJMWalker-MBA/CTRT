name: PR35 runner line fix

on:
  push:
    branches:
      - phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py')
          text = path.read_text()
          text = text.replace(
              'CheckpointEvidence = cp.StoredAdjudicatorCredentialRevocationCheckpointEvidence\n',
              'CheckpointEvidence = cp.StoredAdjudicatorCredentialRevocationCheckpointEvidence\n'
              'load_checkpoint_evidence = (\n'
              '    cp.load_checkpoint_conflict_witness_adjudicator_credential_revocation_checkpoint_evidence\n'
              ')\n'
              'validate_checkpoints = (\n'
              '    cp.validate_checkpoint_conflict_witness_adjudicator_credential_revocation_checkpoints\n'
              ')\n',
          )
          text = text.replace(
              'checkpoint_evidence = cp.load_checkpoint_conflict_witness_adjudicator_credential_revocation_checkpoint_evidence(',
              'checkpoint_evidence = load_checkpoint_evidence(',
          )
          text = text.replace(
              'checkpoint_report = cp.validate_checkpoint_conflict_witness_adjudicator_credential_revocation_checkpoints(',
              'checkpoint_report = validate_checkpoints(',
          )
          path.write_text(text)
          PY
      - run: python -m pip install ruff==0.16.1
      - run: python -m ruff check --fix src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py
          git commit -m "Format named-witness checkpoint runner"
          git push
