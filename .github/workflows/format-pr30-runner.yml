name: Format PR 30 runner

on:
  push:
    branches:
      - phase1/adjudicator-checkpoint-conflict-adjudicator-credential-revocation-checkpoint-witness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/adjudicator-checkpoint-conflict-adjudicator-credential-revocation-checkpoint-witness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.1'
      - name: Apply exact Ruff import fix
        run: python -m ruff check --fix src/ctrt/witness_gated_adjudicator_checkpoint_conflict_runner.py
      - name: Commit formatter result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ctrt/witness_gated_adjudicator_checkpoint_conflict_runner.py
          if git diff --cached --quiet; then
            echo 'No formatting change required.'
          else
            git commit -m 'Format witness-gated checkpoint-conflict runner imports'
            git push origin HEAD:phase1/adjudicator-checkpoint-conflict-adjudicator-credential-revocation-checkpoint-witness
          fi
