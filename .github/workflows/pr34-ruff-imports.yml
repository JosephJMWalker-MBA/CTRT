name: PR34 Ruff import fix

on:
  push:
    branches:
      - phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.1'
      - name: Apply exact repository import ordering
        run: |
          python -m ruff check src/ctrt/__init__.py --fix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ctrt/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix checkpoint public API import order"
            git push
          fi
