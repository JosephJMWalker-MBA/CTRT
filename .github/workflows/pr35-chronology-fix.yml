name: PR35 chronology fix

on:
  push:
    branches:
      - phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/checkpoint-conflict-revocation-witness-conflict-adjudicator-credential-revocation-checkpoint-witness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py')
          text = path.read_text()
          text = text.replace(
              '        credential_completed_at: str,\n        checkpoint_completed_at: str,\n        completed_at: str,',
              '        credential_completed_at: str,\n        revocation_completed_at: str,\n'
              '        checkpoint_completed_at: str,\n        completed_at: str,',
          )
          text = text.replace(
              '                    revocation_completed_at=checkpoint_completed_at,\n'
              '                    completed_at=completed_at,',
              '                    revocation_completed_at=revocation_completed_at,\n'
              '                    completed_at=checkpoint_completed_at,',
          )
          path.write_text(text)
          PY
      - run: python -m pip install ruff==0.16.1
      - run: python -m ruff check --fix src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ctrt/witness_gated_witness_conflict_adjudicator_checkpoint_runner.py
          git commit -m "Separate witness checkpoint completion boundaries"
          git push
